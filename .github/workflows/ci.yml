name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.10.0', stable]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ANYSQL_POSTGRES_HOST: localhost
      ANYSQL_POSTGRES_PORT: 5432
      ANYSQL_POSTGRES_DATABASE: postgres
      ANYSQL_POSTGRES_USERNAME: postgres
      ANYSQL_MYSQL_HOST: localhost
      ANYSQL_MYSQL_PORT: 3306
      ANYSQL_MYSQL_DATABASE: mysql
      ANYSQL_MYSQL_USERNAME: root
      ANYSQL_MONGODB_HOST: localhost
      ANYSQL_MONGODB_PORT: 27017
      ANYSQL_MONGODB_DATABASE: test
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test
      - run: dart pub publish --dry-run
